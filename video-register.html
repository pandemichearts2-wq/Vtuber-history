<!doctype html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>情報登録へ移動 | Graduate History</title>
  <meta http-equiv="refresh" content="0;url=register.html?mode=video">
  <script>
    const target = new URL("register.html", location.href);
    target.searchParams.set("mode", "video");

    location.replace(target.href);
  </script>
</head>
